# Auto-publish due Instagram queue items (spam-safe cadence).
# Requires GitHub Secrets: META_PAGE_ACCESS_TOKEN, INSTAGRAM_BUSINESS_ACCOUNT_ID,
# PUBLIC_AD_VIDEO_BASE_URL (optional if hardcoded in repo env).
#
# Until secrets exist, this workflow no-ops safely on dry-run failure.

name: IG scheduled publish

on:
  schedule:
    # Every 2 hours
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Publish due Reels
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          PUBLIC_AD_VIDEO_BASE_URL: ${{ secrets.PUBLIC_AD_VIDEO_BASE_URL }}
        run: |
          if [ -z "$META_PAGE_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_BUSINESS_ACCOUNT_ID" ]; then
            echo "Missing Meta secrets — skip publish. See docs/META_POSTING_HANDOFF.md"
            exit 0
          fi
          if [ ! -f instagram-release/QUEUE.json ]; then
            echo "QUEUE.json missing — building queue"
            npm run ig:queue
          fi
          npm run ig:publish -- --limit 1
      - name: Commit queue state
        if: success()
        run: |
          git config user.name "apex-ig-bot"
          git config user.email "ops@apexcapitaladmin.com"
          git add instagram-release/QUEUE.json instagram-release/posted-slugs.json || true
          git diff --staged --quiet || git commit -m "chore: IG queue publish state"
          git push || true
